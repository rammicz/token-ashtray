[package]
name = "token-ashtray"
version = "0.3.0"
edition = "2024"
description = "The tray app for token maxxers"
license = "MIT"
repository = "https://github.com/rammicz/token-ashtray"
publish = false

[build-dependencies]
winres = "0.1.12"

[dependencies]
# `directories-next` preserves the directories 5-compatible API without the
# MPL-only `option-ext` dependency introduced by directories 6.
directories = { package = "directories-next", version = "2.0.0" }
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
async-trait = "0.1"
quick-xml = "=0.41.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
toml_edit = { version = "0.23", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
ksni = { version = "0.3.6", features = ["blocking"] }
x11rb = { version = "0.13.2", features = ["randr"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# 0.14.2 changed its Linux-only dependency from `directories-next` to `dirs`.
# Keep 0.14.1, whose Windows tray event API is compatible with this app and
# whose complete lock graph has no MPL-only `option-ext` crate.
tray-icon = "=0.14.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Keep local builds small while retaining file/line information in backtraces.
# Tests inherit this profile. Rebuilds trade incremental speed for disk space.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Retain the pinned native fixes documented in docs/EFRAME-PATCH.md and
# docs/WINIT-PATCH.md without updating dependency versions.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
winit = { path = "vendor/winit" }

[features]
# QA ONLY (#52): trust the public TEST release root, never make an update
# request, and stage a test-signed release from local files with the
# update_seed_probe example. Release builds never enable it.
qa-offline-update = []

[[example]]
name = "refresh_feedback_probe"
path = "src/refresh_feedback_probe.rs"

[[example]]
name = "update_seed_probe"
path = "examples/update_seed_probe.rs"
required-features = ["qa-offline-update"]
